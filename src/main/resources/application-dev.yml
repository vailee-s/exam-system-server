spring:
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Redisson 分布式锁开关 (本地 Redis 启动后可设置为 true)
  redisson:
    enabled: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.exam.entity
  configuration:
    # 开启驼峰命名规则转换
    map-underscore-to-camel-case: true
    # 控制台打印 SQL 方便开发调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键生成策略 (AUTO: 自增, ASSIGN_ID: 雪花算法分布式唯一ID)
      id-type: auto
      # 逻辑删除全局字段与取值
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# MinIO 对象存储配置
minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: exam-bucket
